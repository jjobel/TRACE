[project]
name = "trace-telemetry"
version = "0.1.0"
description = "Analysis core of TRACE Telemetry: Adapters, Log storage and the local API."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy",
    "pyarrow",
    "pydantic",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
